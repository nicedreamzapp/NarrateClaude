-size="17" font-weight="500" fill="#f2f5fa">The keyboard is optional.</text></g><g transform="translate(540.2,0)"><clipPath id="c0_2"><rect width="279.8" height="109" rx="10"/></clipPath><rect width="279.8" height="109" rx="10" fill="url(#n)"/><rect width="279.8" height="4" fill="#8a6a3a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="278.8" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="142" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">🪄 Coming in 2.0</text><text x="142" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Talking Stick mode: interrupt it</text><text x="142" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">mid-sentence.</text></g></g></svg>
