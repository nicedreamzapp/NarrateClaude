site_name: NarrateClaude
site_description: >-
  NarrateClaude is a hands-free voice loop for Claude Code on macOS. It
  transcribes your speech on-device with Apple's Speech framework, types it
  into the Terminal window running claude, and speaks replies through any
  voice you plug in.
site_author: nicedreamzapp
# Placeholder until GitHub Pages is switched on for this repo.
site_url: https://nicedreamzapp.github.io/NarrateClaude/
repo_url: https://github.com/nicedreamzapp/NarrateClaude
repo_name: nicedreamzapp/NarrateClaude
edit_uri: edit/main/docs/
copyright: NarrateClaude is MIT licensed.

theme:
  name: material
  language: en
  icon:
    logo: material/microphone-message
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  # The sitemap is generated automatically from site_url (sitemap.xml).
  - social

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nicedreamzapp/NarrateClaude
    - icon: fontawesome/brands/discord
      link: https://discord.gg/ZdSqgAxUW

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Credits: credits.md
